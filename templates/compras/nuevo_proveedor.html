{% extends "base.html" %}

{% block title %}
Nuevo proveedor - ABC Business Manager
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Nuevo proveedor</h1>

        <p>
            Registra un proveedor para utilizarlo en tus compras.
        </p>
    </div>

</div>


<div class="card">

    <form
        method="POST"
        action="{{ url_for('compras.nuevo_proveedor') }}"
    >

        <div class="form-group">

            <label for="nombre">
                Nombre *
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="150"
                required
            >

        </div>


        <div class="form-group">

            <label for="telefono">
                Teléfono
            </label>

            <input
                type="text"
                id="telefono"
                name="telefono"
                maxlength="30"
            >

        </div>


        <div class="form-group">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="150"
            >

        </div>


        <div class="form-group">

            <label for="direccion">
                Dirección
            </label>

            <input
                type="text"
                id="direccion"
                name="direccion"
                maxlength="255"
            >

        </div>


        <div class="form-group">

            <label for="notas">
                Notas
            </label>

            <textarea
                id="notas"
                name="notas"
                rows="4"
            ></textarea>

        </div>


        <div style="
            display: flex;
            gap: 10px;
            margin-top: 20px;
        ">

            <a
                href="{{ url_for('compras.nueva') }}"
                class="btn-secondary"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn-primary"
            >
                💾 Guardar proveedor
            </button>

        </div>

    </form>

</div>

{% endblock %}

<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Acceso - ABC Business Manager
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #202331;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(53, 73, 160, 0.16),
                    transparent 320px
                ),
                radial-gradient(
                    circle at 88% 15%,
                    rgba(255, 233, 2, 0.12),
                    transparent 300px
                ),
                linear-gradient(
                    135deg,
                    #f4f6fb,
                    #ffffff
                );

        }


        .login-wrapper {

            width: 100%;
            max-width: 420px;

        }


        .login-card {

            width: 100%;

            padding: 34px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            border:
                1px solid
                #e1e6ef;

            border-radius:
                18px;

            box-shadow:
                0 18px 50px
                rgba(
                    5,
                    16,
                    65,
                    0.12
                );

        }


        .login-brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .login-logo {

            width: 72px;
            height: 72px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto
                14px;

            border-radius:
                20px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #051041,
                    #3549a0
                );

            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 10px 25px
                rgba(
                    5,
                    16,
                    65,
                    0.18
                );

        }


        .login-brand h1 {

            color: #0a205c;

            font-size: 25px;
            line-height: 1.15;

        }


        .login-brand p {

            margin-top: 7px;

            color: #6d7688;

            font-size: 13px;

        }


        .login-label {

            display: block;

            margin-bottom: 7px;

            color: #3c455d;

            font-size: 13px;
            font-weight: 700;

        }


        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            width: 100%;

            min-height: 48px;

            padding:
                11px
                48px
                11px
                13px;

            color: #202331;

            background: #ffffff;

            border:
                1px solid
                #d6dae5;

            border-radius:
                10px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease;

        }


        .password-wrapper input:focus {

            border-color:
                #3549a0;

            box-shadow:
                0 0 0 3px
                rgba(
                    53,
                    73,
                    160,
                    0.12
                );

        }


        .password-toggle {

            position: absolute;

            top: 50%;
            right: 8px;

            transform:
                translateY(-50%);

            width: 34px;
            height: 34px;

            border: 0;

            border-radius:
                8px;

            background:
                transparent;

            color:
                #68738a;

            cursor: pointer;

            font-size: 17px;

        }


        .password-toggle:hover {

            background:
                #f1f4f9;

        }


        .login-error {

            margin-bottom:
                15px;

            padding:
                10px 12px;

            color:
                #a91f2d;

            background:
                #fff0f0;

            border:
                1px solid
                #f2c2c6;

            border-radius:
                9px;

            font-size:
                12px;

        }


        .login-button {

            width: 100%;

            min-height:
                48px;

            margin-top:
                17px;

            border:
                1px solid
                #051041;

            border-radius:
                10px;

            color:
                #ffffff;

            background:
                #051041;

            font-size:
                14px;

            font-weight:
                800;

            cursor:
                pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;

        }


        .login-button:hover {

            background:
                #293a82;

            border-color:
                #293a82;

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(
                    5,
                    16,
                    65,
                    0.18
                );

        }


        .login-footer {

            margin-top:
                20px;

            text-align:
                center;

            color:
                #8a92a2;

            font-size:
                11px;

        }


        .login-secure {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

        }


        @media (
            max-width: 480px
        ) {

            body {

                padding:
                    16px;

            }


            .login-card {

                padding:
                    27px 22px;

            }


            .login-logo {

                width:
                    64px;

                height:
                    64px;

            }


            .login-brand h1 {

                font-size:
                    22px;

            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-card">


        <div class="login-brand">


            <div class="login-logo">
                ABC
            </div>


            <h1>
                ABC Business Manager
            </h1>


            <p>
                Ingresa tu contraseña para continuar.
            </p>


        </div>


        {% if error %}

            <div class="login-error">

                {{ error }}

            </div>

        {% endif %}


        <form
            method="POST"
            autocomplete="on"
        >


            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >


            <label
                for="password"
                class="login-label"
            >
                Contraseña
            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    autofocus
                    required
                >


                <button
                    type="button"
                    class="password-toggle"
                    id="password-toggle"
                    aria-label="Mostrar contraseña"
                >
                    👁
                </button>


            </div>


            <button
                type="submit"
                class="login-button"
            >
                Entrar
            </button>


        </form>


        <div class="login-footer">

            <span class="login-secure">
                🔒 Acceso privado
            </span>

        </div>


    </div>


</div>


<script>

    const passwordInput =
        document.getElementById(
            "password"
        );


    const passwordToggle =
        document.getElementById(
            "password-toggle"
        );


    passwordToggle.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type
                === "password"
            ) {

                passwordInput.type =
                    "text";

                passwordToggle.textContent =
                    "🙈";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Ocultar contraseña"
                );

            } else {

                passwordInput.type =
                    "password";

                passwordToggle.textContent =
                    "👁";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Mostrar contraseña"
                );

            }

        }
    );

</script>


</body>

</html>
